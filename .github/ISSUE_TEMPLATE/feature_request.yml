name: Idea or feature request
description: Something ChangeKeeper should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does ChangeKeeper get in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: Your idea. Rough is fine.
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Which agents do you use?
      multiple: true
      options: [Claude Code, Codex, Copilot, Cursor, Another agent, None]
