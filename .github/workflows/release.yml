name: Release

# Tag vX.Y.Z (on a commit reachable from main) → check, package, publish to VS Marketplace + Open VSX,
# attach the .vsix to a GitHub release. Re-running after a partial failure is safe: a version that is
# already published on a registry is detected and skipped.
# Required repository secrets: VSCE_PAT (Azure DevOps PAT, Marketplace › Manage), OVSX_PAT (open-vsx.org token).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag is on main and matches package.json
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag commit is not on main"; exit 1; }
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "tag $TAG != package.json $PKG"; exit 1; }
      # A build that advertises Pro (pricing "Trial") must not ship with an empty Polar config
      # (docs/PLAN.md §5 F4 and the reference workflow in ideasVs/plantillas). Free-only builds skip this.
      - name: Pro guard (only when the listing advertises Pro)
        run: |
          PRICING="$(node -p "require('./package.json').pricing || 'Free'")"
          if [ "$PRICING" = "Trial" ]; then
            node -e "const s=require('fs').readFileSync('src/pro/polarConfig.ts','utf8'); const org=/POLAR_ORGANIZATION_ID = '([^']*)'/.exec(s)?.[1]; const url=/POLAR_CHECKOUT_URL = '([^']*)'/.exec(s)?.[1]; if(!org||!url){console.error('POLAR_ORGANIZATION_ID / POLAR_CHECKOUT_URL are empty in src/pro/polarConfig.ts — the listing advertises Pro (pricing Trial); fill them (docs/TUS-TAREAS.md, block B) before tagging.'); process.exit(1);} console.log('Pro configured');"
          else
            echo "free-only build (pricing $PRICING): no Pro guard"
          fi
      - run: npm run check
      - run: node scripts/l10n-sync.mjs
      - run: npx vsce package --no-dependencies -o "changekeeper-${GITHUB_REF_NAME}.vsix"
      - name: Publish to Visual Studio Marketplace (skips if this version is already there)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # `vsce show` prints "undefined" (not JSON) when the extension is not published yet: treat anything unparsable as "not there".
          if npx vsce show argalla.changekeeper --json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{let j={};try{j=JSON.parse(d)||{}}catch{}process.exit((j.versions||[]).some(v=>v.version==='$VER')?0:1)})"; then
            echo "Marketplace already has $VER — skipping"
          else
            npx vsce publish --no-dependencies --packagePath "changekeeper-${GITHUB_REF_NAME}.vsix"
          fi
      - name: Publish to Open VSX (skips if this version is already there)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if npx ovsx get argalla.changekeeper -v "$VER" --metadata >/dev/null 2>&1; then
            echo "Open VSX already has $VER — skipping"
          else
            npx ovsx publish "changekeeper-${GITHUB_REF_NAME}.vsix" -p "$OVSX_PAT"
          fi
      - name: GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: changekeeper-${{ github.ref_name }}.vsix
          generate_release_notes: true
